<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星港便笺</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: #0e1116; color: #e6ebf2;
    font: 14px/1.6 "Microsoft YaHei UI", "PingFang SC", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid #262e3b;
    background: #131820;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 650; }
  .spacer { flex: 1; }
  .stat { font-size: 12px; color: #8b97a8; }
  button {
    border: 1px solid #262e3b; background: #171d27; color: #8b97a8;
    padding: 4px 10px; border-radius: 7px; cursor: pointer;
  }
  button:hover { color: #e6ebf2; border-color: #6ea8fe; }
  textarea {
    flex: 1; width: 100%; resize: none;
    padding: 14px 16px; border: 0; outline: none;
    background: #0e1116; color: #e6ebf2;
    font: 14px/1.75 "Cascadia Mono", Consolas, monospace;
  }
  .tip { padding: 6px 14px; font-size: 11.5px; color: #5f6b7d; border-top: 1px solid #262e3b; }
</style>
</head>
<body>
<header>
  <h1>星港便笺</h1>
  <span class="stat" id="stat">0 字</span>
  <span class="spacer"></span>
  <button id="save">保存至本地文件</button>
  <button id="clear">清空</button>
</header>
<textarea id="ta" placeholder="随手记点什么…（自动保存到浏览器本地）" spellcheck="false"></textarea>
<div class="tip">static 型应用示例：没有后端进程，数据存 localStorage，全部离线。</div>

<script>
  const KEY = 'starport.notepad.content';
  const ta = document.getElementById('ta');
  const stat = document.getElementById('stat');
  const count = () => { stat.textContent = `${ta.value.length} 字 · ${ta.value.split(/\n/).length} 行`; };

  ta.value = localStorage.getItem(KEY) || '';
  count();

  let timer;
  ta.addEventListener('input', () => {
    count();
    clearTimeout(timer);
    timer = setTimeout(() => localStorage.setItem(KEY, ta.value), 300);
  });

  document.getElementById('save').onclick = () => {
    const blob = new Blob([ta.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '便笺.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  };
  document.getElementById('clear').onclick = () => {
    if (confirm('清空内容？')) { ta.value = ''; localStorage.removeItem(KEY); count(); }
  };
</script>
</body>
</html>
